<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolç y Salat - Reservas</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      color: #c0392b;
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 30px;
    }
    p {
      color: #555;
      margin-bottom: 28px;
      font-size: 16px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      background-color: #c0392b;
      color: white;
      padding: 16px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #a93226;
    }
    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dolç y Salat</h1>
    <p>Haz tu reserva en línea en pocos segundos. Selecciona la fecha, hora y número de personas.</p>
    
    <a class="btn" href="https://www.appsheet.com/start/0397e665-a499-4661-81df-c68ea9952c2b#appName=DolcySalayReservas-981535271&page=form&row=" target="_blank" rel="noopener">
      Reservar Mesa
    </a>

    <div class="footer">
      © Dolç y Salat — Horario de servicio: 10:00 a 23:00
    </div>
  </div>

</body>
</html>
