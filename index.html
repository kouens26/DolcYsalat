<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Dolç y Salat</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #e11d48;
      --primary-hover: #be123c;
      --accent: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px 24px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.4);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 15px 20px -3px rgba(225, 29, 72, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="brand-title">Dolç y Salat</h1>
    <p class="subtitle">Gestión de Reservas y Citas</p>
    
    <a class="btn" href="https://www.appsheet.com/start/0397e665-a499-4661-81df-c68ea9952c2b" target="_self">
      Reservar Mesa
    </a>

    <p class="footer-note">Confirmación instantánea de tu mesa</p>
  </div>

</body>
</html>
