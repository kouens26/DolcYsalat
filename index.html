<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolç y Salat - Reservas</title>
  <style>
    :root {
      --primary: #c0392b;
      --primary-hover: #a93226;
      --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      --card-bg: #ffffff;
      --text-dark: #2c3e50;
      --text-muted: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      background-color: #fbeee8;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      font-size: 32px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--primary);
      color: #ffffff;
      padding: 18px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(192, 57, 43, 0.28);
    }

    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #f1f3f5;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-icon">🍽️</div>
    <h1>Dolç y Salat</h1>
    <p>Haz tu reserva de mesa en línea en pocos segundos. Selecciona la fecha, hora y número de personas.</p>
    
    <a class="btn" href="https://www.appsheet.com/start/0397e665-a499-4661-81df-c68ea9952c2b" target="_blank" rel="noopener">
      <span>Reservar Mesa</span>
    </a>

    <div class="footer">
      © Dolç y Salat — Horario de servicio: 10:00 a 23:00
    </div>
  </div>

</body>
</html>
